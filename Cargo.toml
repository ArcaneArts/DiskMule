[package]
name = "diskmule"
version = "0.1.0"
edition = "2024"
description = "A model-pluggable inference runtime for Apple Silicon"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ArcaneArts/DiskMule"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = "0.3"
memmap2 = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
